[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-api"
version = "0.1.0"
description = "the rest api"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "asyncpg",
    "pillow>=12.3.0",
    "shapely>=2.0",
    "pydantic-settings>=2.0",
    "database==0.1.0",
    "tools==0.1.0",
    "httpx==0.28.1",
    "paho-mqtt>=2.1,<3",    
]

[project.scripts]
rest_api = "rest_api.main:start"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rest_api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
db = { path = "vendor/db-0.1.0-py3-none-any.whl" }
tools = { path = "vendor/transient_lab_tools-0.1.0-py3-none-any.whl" }