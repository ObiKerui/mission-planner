[build-system]
requires = ["setuptools>=61", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "transient-lab-tools"
version = "0.1.0"
description = "Scientific data generation and processing tools for TransientLab"
requires-python = ">=3.11"
dependencies = [
    "fsspec",
    "s3fs",
    "matplotlib",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "click>=8.1",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "astropy>=6.0",
    "database==0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build"
]

[project.scripts]
transient-lab = "transient_lab_tools.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
db = { path = "vendor/db-0.1.0-py3-none-any.whl" }